# Cloudflare Pages project config (Functions + bindings).
# When this file is present it becomes the source of truth for Pages config.
# See README for dashboard fallback if the AI binding does not attach on deploy.

name = "jessepoteet"
compatibility_date = "2024-11-12"
pages_build_output_dir = "dist"

# Workers AI: available in Pages Functions as context.env.AI
[ai]
binding = "AI"
